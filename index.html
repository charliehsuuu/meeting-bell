<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>會議鈴</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#161310">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="會議鈴">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
<style>
:root{
  --ink:#161310; --ink2:#211D18; --ink3:#2C271F;
  --line:#3A342B; --brass:#D4A72C; --brass-d:#8A6B14;
  --paper:#F0EADD; --dim:#8B8175; --alarm:#E0603C;
  --sans:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--ink); color:var(--paper); font-family:var(--sans);
  font-size:16px; line-height:1.5; overscroll-behavior:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.wrap{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:14px 18px 18px}
.hide{display:none!important}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:var(--paper);background:var(--ink3);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px}
.pos{color:var(--dim);font-size:14px;letter-spacing:.02em}
.ghost{color:var(--dim);font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:8px}

.stage{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:8px 0}
.now{font-size:21px;font-weight:600;margin-bottom:2px;max-width:100%;overflow-wrap:anywhere}
.alloc{color:var(--dim);font-size:14px}
.clock{
  font-size:clamp(76px,26vw,132px); font-weight:600; letter-spacing:-.03em;
  font-variant-numeric:tabular-nums; margin:10px 0 4px; color:var(--paper);
}
.clock.warn{color:var(--brass)}
.clock.over{color:var(--alarm)}
.next{color:var(--dim);font-size:14px;min-height:21px;max-width:100%;overflow-wrap:anywhere}

.ctrl{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:10px;margin-top:18px}
.ctrl button{border:1px solid var(--line);border-radius:12px;padding:16px 4px;font-size:15px;background:var(--ink2)}
.ctrl button:active{background:var(--ink3)}
.ctrl button[disabled]{opacity:.35}
#go{font-weight:600;font-size:17px}

.bell{
  width:100%;margin-top:14px;background:var(--brass);color:#231A03;
  border-radius:16px;padding:26px 0;font-size:20px;font-weight:700;letter-spacing:.06em;
}
.bell:active{background:var(--brass-d);color:var(--paper)}

.foot{display:flex;align-items:center;gap:14px;margin-top:16px;color:var(--dim);font-size:13px}
.foot input[type=range]{flex:1;width:auto;padding:0;background:none;border:none;accent-color:var(--brass)}

h2{font-size:18px;font-weight:600;margin:18px 0 10px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row .nm{flex:1}
.row .mn{width:74px;text-align:center}
.row .del{color:var(--dim);padding:8px;font-size:19px;line-height:1}
.add{width:100%;border:1px dashed var(--line);border-radius:10px;padding:13px;color:var(--dim);margin-top:2px}
.primary{width:100%;background:var(--brass);color:#231A03;border-radius:12px;padding:16px;font-weight:600;margin-top:18px}
.opt{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:14px;margin-top:12px}
.opt input[type=checkbox]{width:20px;height:20px;accent-color:var(--brass);flex:none}
.note{color:var(--dim);font-size:13px;line-height:1.6;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}

table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:11px 4px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:400;font-size:13px}
th:first-child,td:first-child{text-align:left}
td.over{color:var(--alarm)}
td.under{color:var(--brass)}
</style>
</head>
<body>
<div class="wrap">

  <div class="bar">
    <div class="pos" id="pos">議程</div>
    <button class="ghost" id="edit">議程</button>
  </div>

  <main id="run" class="stage">
    <div class="now" id="now">尚未開始</div>
    <div class="alloc" id="alloc">先設定議程</div>
    <div class="clock" id="clock">0:00</div>
    <div class="next" id="next"></div>
  </main>

  <div id="runctrl">
    <div class="ctrl">
      <button id="prev">上一項</button>
      <button id="go">開始</button>
      <button id="next-btn">下一項</button>
    </div>
    <button class="bell" id="bell">按 鈴</button>
    <div class="foot">
      <span>音量</span>
      <input type="range" id="vol" min="20" max="100" step="5" value="100" aria-label="音量">
      <span id="volOut">100%</span>
    </div>
  </div>

  <section id="editor" class="hide">
    <h2>議程</h2>
    <div id="rows"></div>
    <button class="add" id="add">＋ 新增項目</button>
    <label class="opt"><input type="checkbox" id="warnOn" checked>剩 1 分鐘先響一聲預告</label>
    <label class="opt"><input type="checkbox" id="overOn" checked>超時後每分鐘再響一次</label>
    <button class="primary" id="done">套用議程</button>
    <div class="note">
      開會前先按一次鈴確認音量，iPhone 側邊靜音鍵要關閉。<br>
      計時期間螢幕會保持常亮，手機請正面朝上放在桌面。
    </div>
  </section>

  <section id="report" class="hide">
    <h2>時間紀錄</h2>
    <table id="rep"></table>
    <button class="primary" id="again">重新開始</button>
  </section>

</div>

A8ADgAKAAUAAAD8//n/+f/5//n/+P/4//f/9//5//z///8BAAUACAAMAA4ADwANAAgAAwD///v/+f/5//n/+f/5//j/9//4//r//P8AAAIABgAJAAwADgAOAAsABgABAP7/+//6//r/+v/6//j/+P/3//j/+//9/wAAAwAGAAoADQAOAA0ACQAEAAAA/f/7//r/+//6//r/+P/4//j/+f/7//7/AAAEAAcACgANAA0ACwAIAAMA///8//v/+//7//v/+v/4//j/+P/6//z///8BAAQACAALAA0ADAAKAAYAAQD+//z//P/8//v/+//6//n/+P/5//r//f8AAAIABQAIAAsADAALAAgABAAAAP7//P/8//z//P/7//r/+f/4//n/+//+/wAAAgAGAAkACwAMAAoABgACAAAA/v/9//3//P/8//v/+f/5//n/+v/8//7/AAADAAcACgALAAsACAAFAAEA///9//3//f/9//z/+//5//n/+f/7//3///8BAAQABwAKAAsACgAHAAMAAAD///7//f/+//3//P/6//n/+f/6//v//f8AAAEABQAIAAoACgAIAAUAAgAAAP7//v/+//7//f/8//r/+v/6//r//P/+/wAAAgAFAAgACgAJAAcABAABAP///v/+//7//v/9//v/+v/6//r/+//8//7/AAADAAYACAAJAAgABgADAAAA///////////+//3/+//6//r/+v/8//3///8BAAQABgAIAAkABwAEAAIAAAD///////////7//f/7//v/+v/7//z//v8AAAEABAAHAAgACAAGAAMAAQAAAP///////////v/8//v/+//7//v//f/+/wAAAgAFAAcACAAHAAUAAgAAAAAA//8AAP/////+//z/+//7//v//P/9////AAADAAUABwAHAAYAAwABAAAAAAAAAAAAAAD///3//P/8//v//P/8//7/AAABAAQABgAHAAYABQACAAAAAAAAAAAAAAD///7//f/8//z//P/8//3//v8AAAIABAAGAAYABQAEAAIAAAAAAAAAAAAAAP///v/9//z//P/8//z//f///wAAAgAEAAUABgAEAAMAAQAAAAAAAAAAAAAA///+//3//P/8//z//f/+////AAADAAQABQAFAAMAAgAAAAAAAAAAAAAAAAD///7//f/9//z//f/9//7/AAABAAMABAAFAAQAAgABAAAAAAAAAAAAAAAAAP///v/9//3//f/9//7///8AAAIAAwAEAAQAAwACAAEAAAAAAAAAAAAAAAAA///+//3//f/9//3//v///wAAAgADAAQAAwACAAEAAAAAAAAAAAAAAAAAAAD///7//f/9//3//v///wAAAQACAAMAAwADAAIAAQAAAAAAAAAAAAAAAAD//////v/+//3//v/+////AAABAAIAAwADAAIAAQAAAAAAAAAAAAAAAAAAAP/////+//7//v/+////AAAAAAEAAgADAAIAAQABAAAAAAAAAAAAAAAAAAAA//////7//v/+//7///8AAAAAAQACAAIAAgABAAAAAAAAAAAAAAAAAAAAAAD//////v/+//7//////wAAAQABAAIAAgABAAAAAAAAAAAAAAAAAAAAAAAAAP///////////////wAAAAABAAEAAQABAAEAAAAAAAAAAAAAAAAAAAAAAAAA////////////////AAAAAAEAAQABAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP//////////AAAAAAAAAQABAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA////////AAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=';
const $=s=>document.querySelector(s);
const KEY='meetingbell.v1';

let items=[{n:'開場',m:3},{n:'業務報告',m:10},{n:'討論',m:10},{n:'結論',m:5}];
let opts={warn:true,over:true,vol:100};
let idx=0,running=false,startAt=0,acc=0,tid=null,lock=null;
let firedWarn=false,firedEnd=false,lastOver=0;

try{
  const s=JSON.parse(localStorage.getItem(KEY)||'null');
  if(s&&Array.isArray(s.items)&&s.items.length){items=s.items;opts=Object.assign(opts,s.opts||{});}
}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({items,opts}));}catch(e){}}

/* ---------- audio ---------- */
let ac=null,buf=null,gain=null;
function bytes(b64){const s=atob(b64),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a.buffer;}
function audio(){
  if(!ac){
    ac=new (window.AudioContext||window.webkitAudioContext)();
    gain=ac.createGain();gain.connect(ac.destination);
    ac.decodeAudioData(bytes(B64),b=>{buf=b;});
  }
  if(ac.state==='suspended')ac.resume();
  gain.gain.value=opts.vol/100;
  return ac;
}
function hit(at,g){
  if(!buf)return;
  const s=ac.createBufferSource();s.buffer=buf;
  const v=ac.createGain();v.gain.value=g;
  s.connect(v);v.connect(gain);s.start(at);
}
function ring(n){
  audio();
  if(!buf){setTimeout(()=>ring(n),120);return;}
  const t=ac.currentTime+0.02;
  for(let i=0;i<n;i++)hit(t+i*0.40,i?0.86:1);
  if(navigator.vibrate)navigator.vibrate(n>1?[90,170,90]:[90]);
}

/* ---------- wake lock ---------- */
async function wake(on){
  try{
    if(on&&'wakeLock' in navigator&&!lock){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>{lock=null;});}
    else if(!on&&lock){await lock.release();lock=null;}
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&running)wake(true);});

/* ---------- timer ---------- */
const alloc=()=>(items[idx]?items[idx].m:0)*60;
const spent=()=>Math.round((acc+(running?Date.now()-startAt:0))/1000);
function fmt(s){const g=s<0?'-':'';s=Math.abs(s);return g+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

function paint(){
  const it=items[idx];
  if(!it){return;}
  const left=alloc()-spent();
  $('#pos').textContent='第 '+(idx+1)+' / '+items.length+' 項';
  $('#now').textContent=it.n||'（未命名）';
  $('#alloc').textContent='分配 '+it.m+' 分鐘'+(running?'':(spent()?'．已暫停':''));
  $('#clock').textContent=fmt(left);
  $('#clock').className='clock'+(left<0?' over':(left<=60?' warn':''));
  $('#next').textContent=items[idx+1]?('下一項：'+(items[idx+1].n||'（未命名）')+'　'+items[idx+1].m+' 分'):'最後一項';
  $('#prev').disabled=idx===0;
  $('#go').textContent=running?'暫停':(spent()?'繼續':'開始');
  $('#next-btn').textContent=items[idx+1]?'下一項':'結束';
}
function tick(){
  const left=alloc()-spent();
  if(opts.warn&&!firedWarn&&left<=60&&left>0){firedWarn=true;ring(1);}
  if(!firedEnd&&left<=0){firedEnd=true;lastOver=0;ring(2);}
  if(opts.over&&firedEnd){const o=-left;if(o>=lastOver+60){lastOver=Math.floor(o/60)*60;ring(1);}}
  paint();
}
function start(){
  audio();startAt=Date.now();running=true;
  tid=setInterval(tick,250);wake(true);paint();
}
function pause(){
  if(!running)return;
  acc+=Date.now()-startAt;running=false;
  clearInterval(tid);tid=null;wake(false);paint();
}
function jump(to){
  const was=running;
  if(running){acc+=Date.now()-startAt;running=false;clearInterval(tid);tid=null;}
  items[idx].used=spent();
  idx=to;acc=0;firedWarn=false;firedEnd=false;lastOver=0;
  if(was){startAt=Date.now();running=true;tid=setInterval(tick,250);}
  paint();
}
function finish(){
  pause();items[idx].used=spent();
  const rows=['<tr><th>項目</th><th>分配</th><th>實際</th><th>差異</th></tr>'];
  let ta=0,tu=0;
  items.forEach(it=>{
    const a=it.m*60,u=it.used||0,d=u-a;ta+=a;tu+=u;
    rows.push('<tr><td>'+esc(it.n||'（未命名）')+'</td><td>'+fmt(a)+'</td><td>'+fmt(u)+'</td><td class="'+(d>0?'over':'under')+'">'+(d>0?'+':'')+fmt(d)+'</td></tr>');
  });
  rows.push('<tr><td>合計</td><td>'+fmt(ta)+'</td><td>'+fmt(tu)+'</td><td class="'+(tu>ta?'over':'under')+'">'+(tu>ta?'+':'')+fmt(tu-ta)+'</td></tr>');
  $('#rep').innerHTML=rows.join('');
  view('report');
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- views ---------- */
function view(v){
  $('#run').classList.toggle('hide',v!=='run');
  $('#runctrl').classList.toggle('hide',v!=='run');
  $('#editor').classList.toggle('hide',v!=='editor');
  $('#report').classList.toggle('hide',v!=='report');
  $('#edit').classList.toggle('hide',v==='report');
  $('#edit').textContent=v==='editor'?'返回':'議程';
  $('#pos').textContent=v==='editor'?'設定議程':(v==='report'?'會議結束':$('#pos').textContent);
}
function drawRows(){
  const box=$('#rows');box.innerHTML='';
  items.forEach((it,i)=>{
    const r=document.createElement('div');r.className='row';
    r.innerHTML='<input class="nm" placeholder="項目名稱" value="'+esc(it.n)+'"><input class="mn" type="number" min="1" max="180" value="'+it.m+'" aria-label="分鐘"><button class="del" aria-label="刪除">×</button>';
    r.querySelector('.nm').oninput=e=>{items[i].n=e.target.value;save();};
    r.querySelector('.mn').oninput=e=>{items[i].m=Math.max(1,Math.min(180,parseInt(e.target.value||1,10)));save();};
    r.querySelector('.del').onclick=()=>{if(items.length>1){items.splice(i,1);save();drawRows();}};
    box.appendChild(r);
  });
}

/* ---------- events ---------- */
$('#go').onclick=()=>{running?pause():start();};
$('#prev').onclick=()=>{if(idx>0)jump(idx-1);};
$('#next-btn').onclick=()=>{items[idx+1]?jump(idx+1):finish();};
$('#bell').onclick=()=>ring(2);
$('#edit').onclick=()=>{
  if($('#editor').classList.contains('hide')){drawRows();view('editor');}
  else{save();idx=0;acc=0;running=false;clearInterval(tid);tid=null;firedWarn=false;firedEnd=false;items.forEach(i=>delete i.used);view('run');paint();}
};
$('#add').onclick=()=>{items.push({n:'',m:5});save();drawRows();};
$('#done').onclick=()=>{save();idx=0;acc=0;firedWarn=false;firedEnd=false;items.forEach(i=>delete i.used);view('run');paint();};
$('#again').onclick=()=>{idx=0;acc=0;firedWarn=false;firedEnd=false;items.forEach(i=>delete i.used);view('run');paint();};
$('#warnOn').onchange=e=>{opts.warn=e.target.checked;save();};
$('#overOn').onchange=e=>{opts.over=e.target.checked;save();};
$('#vol').oninput=e=>{opts.vol=parseInt(e.target.value,10);$('#volOut').textContent=opts.vol+'%';if(gain)gain.gain.value=opts.vol/100;save();};

$('#warnOn').checked=opts.warn;$('#overOn').checked=opts.over;
$('#vol').value=opts.vol;$('#volOut').textContent=opts.vol+'%';
paint();
document.addEventListener('touchstart',function u(){audio();document.removeEventListener('touchstart',u);},{passive:true});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
